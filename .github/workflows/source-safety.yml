name: Source credential check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject private files and recognizable credentials
        run: python scripts/check_public_source.py --staged
