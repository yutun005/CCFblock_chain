name: Dmodule verification

on:
  push:
    branches: [Dmodule]
  pull_request:
    branches: [Dmodule]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.8.5"
      - name: Install locked dependencies and build
        run: python manage.py setup
      - name: Install Playwright Chromium
        run: pnpm --dir .cache/web exec playwright install --with-deps chromium
      - name: Run browser workflow smoke
        run: pnpm --dir .cache/web run test:browser
      - name: Run live browser against Anvil and services
        run: .cache/venv/bin/python manage.py test-browser-live
      - name: Run D interface checks
        run: .cache/venv/bin/python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: .cache/venv/bin/python -m py_compile app.py manage.py
      - name: Run DASC security and accounting tests
        run: python manage.py test-contract
      - name: Run REST, A2A, ABI and recovery scenarios
        run: .cache/venv/bin/python tests/e2e/run_main_scenario.py --repeat 10
      - name: Run travel planning REST, A2A, ABI and recovery scenarios
        run: .cache/venv/bin/python tests/e2e/run_main_scenario.py --scenario travel_planning --repeat 1
      - name: Collect reproducible evidence summaries
        run: .cache/venv/bin/python manage.py collect-results
      - name: Archive raw evidence with checksums
        run: .cache/venv/bin/python manage.py archive-evidence
      - name: Build versioned Dmodule package and checksum
        run: python manage.py package
      - name: Archive raw verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmodule-verification-${{ github.sha }}
          if-no-files-found: warn
          path: |
            experiments/raw/e2e/**
            experiments/raw/forge/**
            experiments/raw/security/**
            experiments/results/**
            .cache/delivery/**
          include-hidden-files: true

  container-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTFLOW_SOURCE_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run clean Compose verification
        run: docker compose run --build --rm verify
      - name: Archive container verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmodule-container-verification-${{ github.sha }}
          if-no-files-found: warn
          path: |
            experiments/raw/**
            experiments/results/**
          include-hidden-files: true
